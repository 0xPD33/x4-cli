[package]
name = "x4-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Put books on an Xteink X4 e-reader over Wi-Fi, with stock or CrossPoint firmware"
license = "MIT"
repository = "https://github.com/0xPD33/x4-cli"
readme = "README.md"
keywords = ["xteink", "x4", "ereader", "epub", "crosspoint"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
epub = "2.1.5"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
tungstenite = "0.30.0"
ureq = { version = "3.4.2", default-features = false }

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }
